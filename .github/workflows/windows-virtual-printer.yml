name: Windows 11 Virtual Printer and Installer

on:
  push:
    branches: [feature/windows11-virtual-printer-psa]
  pull_request:
    branches: [main, feature/windows-file-picker-preview-print]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop and generate runner
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --project-name xp_p323b_windows .
          if ($LASTEXITCODE -ne 0) { throw "Flutter Windows runner generation failed." }
          ./scripts/configure_windows_bridge.ps1

      - name: Get dependencies and configure PDFium
        shell: pwsh
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw "flutter pub get failed." }
          dart run pdfx:install_windows
          if ($LASTEXITCODE -ne 0) { throw "PDFium setup failed." }

      - name: Analyze and test Flutter app
        shell: pwsh
        run: |
          flutter analyze
          if ($LASTEXITCODE -ne 0) { throw "Flutter analyze failed." }
          flutter test
          if ($LASTEXITCODE -ne 0) { throw "Flutter tests failed." }

      - name: Build Flutter Windows release
        shell: pwsh
        run: |
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { throw "Flutter Windows release build failed." }

      - name: Bundle Visual C++ runtime and file association scripts
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "build/windows/x64/runner/Release"
          $vswhere = Join-Path ([Environment]::GetFolderPath("ProgramFilesX86")) "Microsoft Visual Studio/Installer/vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe was not found." }
          $vsInstall = & $vswhere -latest -products '*' -property installationPath
          $redistRoot = Join-Path $vsInstall "VC/Redist/MSVC"
          $crtDir = Get-ChildItem $redistRoot -Directory | Sort-Object Name -Descending |
            ForEach-Object { $candidate = Join-Path $_.FullName "x64/Microsoft.VC143.CRT"; if (Test-Path $candidate) { Get-Item $candidate } } |
            Select-Object -First 1
          if (-not $crtDir) { throw "The x64 Visual C++ runtime was not found." }
          Copy-Item (Join-Path $crtDir.FullName "*") $releaseDir -Recurse -Force
          $required = @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")
          foreach ($dll in $required) { if (-not (Test-Path (Join-Path $releaseDir $dll))) { throw "Missing runtime DLL: $dll" } }
          foreach ($file in @("register_file_associations.ps1","unregister_file_associations.ps1","Register-File-Associations.bat","Unregister-File-Associations.bat")) {
            Copy-Item (Join-Path "scripts" $file) $releaseDir
          }

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Windows 11 virtual-printer MSIX
        shell: pwsh
        run: ./scripts/build_virtual_printer.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Sign MSIX and create unified Setup.exe with temporary test certificate
        shell: pwsh
        run: |
          $password = [guid]::NewGuid().ToString("N") + "aA1!"
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=XP-P323B" -FriendlyName "XP-P323B CI Test Signing" -CertStoreLocation "Cert:\CurrentUser\My" -Provider "Microsoft Enhanced RSA and AES Cryptographic Provider" -KeySpec Signature -KeyAlgorithm RSA -KeyLength 2048 -KeyExportPolicy Exportable -KeyUsage DigitalSignature -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3","2.5.29.19={text}") -NotAfter (Get-Date).AddYears(1)
          $pfx = Join-Path $env:RUNNER_TEMP "XP-P323B-TestSigning.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString -String $password -Force -AsPlainText) | Out-Null
          $env:XP_P323B_SIGNING_PFX_BASE64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($pfx))
          $env:XP_P323B_SIGNING_PFX_PASSWORD = $password
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $expectedIdentity = "XP323B.VirtualPrinter"
          $expectedPublisher = "CN=XP-P323B"
          $packageSearchRoots = @("artifacts/VirtualPrinterPackages", "windows-virtual-printer/PrintSupportApp/AppPackages")
          $candidates = foreach ($root in $packageSearchRoots) {
            if (Test-Path $root) { Get-ChildItem -Path $root -Filter *.msix -Recurse -File }
          }
          $candidates = @($candidates | Sort-Object FullName -Unique)
          $msix = $null
          foreach ($candidate in $candidates) {
            $archive = [System.IO.Compression.ZipFile]::OpenRead($candidate.FullName)
            try {
              $entry = $archive.GetEntry("AppxManifest.xml")
              if (-not $entry) { continue }
              $reader = [IO.StreamReader]::new($entry.Open())
              try { [xml]$manifest = $reader.ReadToEnd() } finally { $reader.Dispose() }
              $identity = $manifest.Package.Identity
              Write-Host "MSIX candidate: $($candidate.FullName) | Identity=$($identity.Name) | Publisher=$($identity.Publisher)"
              if ($identity.Name -eq $expectedIdentity -and $identity.Publisher -eq $expectedPublisher) {
                $msix = $candidate
                break
              }
            } finally { $archive.Dispose() }
          }
          if (-not $msix) {
            throw "The app MSIX (Identity=$expectedIdentity, Publisher=$expectedPublisher) was not found. Refusing to sign a dependency MSIX."
          }
          Write-Host "Selected virtual-printer package: $($msix.FullName)"
          ./scripts/build_windows_installer.ps1 -MsixPath $msix.FullName
          if ($LASTEXITCODE -ne 0) { throw "Setup.exe build failed." }
          Remove-Item $pfx -Force
          Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -Force

      - name: Verify installer output
        shell: pwsh
        run: |
          $setup = "dist/XP-P323B-Setup.exe"
          if (-not (Test-Path $setup -PathType Leaf)) { throw "Setup.exe was not created." }
          $file = Get-Item $setup
          if ($file.Length -lt 1MB) { throw "Setup.exe is unexpectedly small." }
          Get-FileHash $setup -Algorithm SHA256 | Format-List
          Write-Host "Verified $($file.FullName) ($($file.Length) bytes)"

      - name: Upload unified Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: XP-P323B-Setup-exe-test-signed
          path: dist/XP-P323B-Setup.exe
          if-no-files-found: error
          retention-days: 14
